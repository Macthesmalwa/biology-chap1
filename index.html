  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --accent-color: #00adb5;
      --accent-hover: #008c9e;
      --border-color: #333;
      --error-color: #ff5252;
      --success-color: #4caf50;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 800px;
      width: 100%;
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 10px;
      text-align: center;
    }

    .quiz-info {
      background-color: #252525;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      border-left: 4px solid var(--accent-color);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .user-info-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    @media (max-width: 600px) {
      .user-info-section {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-group label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .input-group input {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1fr solid var(--border-color);
      background-color: #2a2a2a;
      color: var(--text-color);
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    .question-card {
      background-color: #252525;
      padding: 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
    }

    .question-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .option-label {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background-color: #1e1e1e;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid var(--border-color);
      transition: background-color 0.2s;
    }

    .option-label:hover {
      background-color: #333;
    }

    .option-label input[type="radio"] {
      margin-right: 12px;
      accent-color: var(--accent-color);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      background-color: var(--accent-hover);
    }

    .btn-submit:disabled {
      background-color: #444;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .error-banner {
      color: var(--error-color);
      font-weight: bold;
      margin-top: 15px;
      text-align: center;
      display: none;
    }

    .results-container {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .score-box {
      font-size: 2rem;
      color: var(--accent-color);
      margin: 15px 0;
    }

    .review-item {
      text-align: left;
      background-color: #252525;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
    }

    .correct-text { color: var(--success-color); }
    .wrong-text { color: var(--error-color); }

<body>

  <div class="container">
    <h1>Biology MCQs: Life Processes</h1>
    
    <div class="quiz-info">
      <span><strong>Total Questions:</strong> 50</span>
      <span><strong>Marks per Question:</strong> 1</span>
      <span><strong>Total Marks:</strong> 50</span>
    </div>

    <!-- AJAX Success/Error Messages -->
    <div data-fs-success style="display:none;"></div>
    <div data-fs-error style="display:none;"></div>

    <form id="quiz-form">
      
      <!-- Student Info Inputs -->
      <div class="user-info-section">
        <div class="input-group">
          <label for="student-name">Full Name *</label>
          <input type="text" id="student-name" name="Name" required data-fs-field placeholder="John Doe">
          <span data-fs-error="Name"></span>
        </div>
        <div class="input-group">
          <label for="student-email">Email Address *</label>
          <input type="email" id="student-email" name="email" required data-fs-field placeholder="john@example.com">
          <span data-fs-error="email"></span>
        </div>
      </div>

      <!-- Hidden Input to Send Score to Formspree -->
      <input type="hidden" id="final-score-input" name="Total Score" value="">
      <input type="hidden" id="answers-summary-input" name="User Answers" value="">

      <!-- Container for Dynamically Rendered Questions -->
      <div id="questions-container"></div>

      <div class="error-banner" id="error-message">Please answer all 50 questions before submitting!</div>

      <button type="submit" id="submit-btn" class="btn-submit" data-fs-submit-btn>Submit Quiz</button>
    </form>

    <!-- Post-submission Display Screen -->
    <div class="results-container" id="results-screen">
      <h2>Submission Successful!</h2>
      <div class="score-box" id="score-display"></div>
      <p id="score-percent"></p>
      <hr style="border-color: var(--border-color); margin: 20px 0;">
      <h3>Answer Key & Review</h3>
      <div id="review-container"></div>
    </div>
  </div>

  <!-- Formspree AJAX Library -->
  <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

  <script>
    // 50 Questions extracted from Chapter 1 Biology Text
    const quizData = [
      { q: "1. Which characteristic is common to all living organisms?", options: ["Ability to fly", "Excretion of waste products", "Photosynthesis", "Presence of a backbone"], answer: 1 },
      { q: "2. The control center of the cell containing genetic material is the:", options: ["Mitochondrion", "Ribosome", "Nucleus", "Vacuole"], answer: 2 },
      { q: "3. Which organelle is responsible for aerobic respiration and producing ATP?", options: ["Chloroplast", "Mitochondrion", "Cell membrane", "Cell wall"], answer: 1 },
      { q: "4. Where does protein synthesis occur in the cell?", options: ["Ribosomes", "Vacuole", "Nucleus", "Cytoplasm"], answer: 0 },
      { q: "5. Plant cell walls are mainly composed of:", options: ["Glycogen", "Starch", "Cellulose", "Protein"], answer: 2 },
      { q: "6. Which structure is present in plant cells but NOT in animal cells?", options: ["Cell membrane", "Permanent vacuole", "Mitochondria", "Cytoplasm"], answer: 1 },
      { q: "7. Biological catalysts that speed up chemical reactions in cells are:", options: ["Hormones", "Enzymes", "Carbohydrates", "Lipids"], answer: 1 },
      { q: "8. The substrate fits specifically into an enzyme's:", options: ["Active site", "Allosteric site", "Cellular edge", "Surface membrane"], answer: 0 },
      { q: "9. When an enzyme's active site changes shape permanently at high temperatures, it is said to be:", options: ["Activated", "Renatured", "Denatured", "Inhibited"], answer: 2 },
      { q: "10. What is the optimum temperature for most enzymes in the human body?", options: ["0°C", "37°C", "60°C", "100°C"], answer: 1 },
      { q: "11. Pepsin, an enzyme found in the stomach, works best at which pH level?", options: ["Acidic (around pH 2)", "Neutral (pH 7)", "Alkaline (pH 11)", "Slightly basic (pH 8)"], answer: 0 },
      { q: "12. In the starch-amylase practical, which reagent tests for the presence of starch?", options: ["Benedict's solution", "Biuret reagent", "Iodine solution", "Ethanol"], answer: 2 },
      { q: "13. What color change indicates the presence of starch when iodine is added?", options: ["Blue to brick red", "Yellow to blue-black", "Clear to cloudy white", "Red to purple"], answer: 1 },
      { q: "14. The breakdown of hydrogen peroxide into water and oxygen in potato tissue is catalyzed by:", options: ["Amylase", "Lipase", "Catalase", "Maltase"], answer: 2 },
      { q: "15. What is the energy currency molecule produced during respiration?", options: ["DNA", "ATP", "RNA", "Glucose"], answer: 1 },
      { q: "16. ATP molecule consists of adenosine bound to how many phosphate groups?", options: ["One", "Two", "Three", "Four"], answer: 2 },
      { q: "17. What are the end products of aerobic respiration?", options: ["Glucose and oxygen", "Carbon dioxide and water (+ ATP)", "Lactic acid and energy", "Ethanol and carbon dioxide"], answer: 1 },
      { q: "18. What are the products of anaerobic respiration in yeast?", options: ["Lactic acid only", "Ethanol and carbon dioxide", "Carbon dioxide and water", "Glucose and oxygen"], answer: 1 },
      { q: "19. Anaerobic respiration in human muscle cells during strenuous exercise produces:", options: ["Ethanol", "Lactic acid", "Starch", "Carbon dioxide only"], answer: 1 },
      { q: "20. The extra oxygen needed to break down accumulated lactic acid after exercise is called:", options: ["Oxygen debt", "Respiration capacity", "Aerobic deficit", "Metabolic surge"], answer: 0 },
      { q: "21. Hydrogen carbonate indicator turns from orange/red to yellow in the presence of:", options: ["Oxygen", "Increased carbon dioxide", "Decreased carbon dioxide", "Nitrogen"], answer: 1 },
      { q: "22. The net movement of particles from an area of high concentration to low concentration is:", options: ["Active transport", "Osmosis", "Diffusion", "Transpiration"], answer: 2 },
      { q: "23. Diffusion is a passive process because it does NOT require:", options: ["A concentration gradient", "Energy/ATP", "Molecules", "A liquid medium"], answer: 1 },
      { q: "24. As the size of an organism/cube increases, its surface area to volume ratio:", options: ["Increases", "Decreases", "Stays the same", "Doubles"], answer: 1 },
      { q: "25. Which factor increases the rate of diffusion?", options: ["Lower temperature", "Smaller surface area", "Steeper concentration gradient", "Greater diffusion distance"], answer: 2 },
      { q: "26. Osmosis is the movement of water molecules across a:", options: ["Freely permeable membrane", "Partially permeable membrane", "Impermeable barrier", "Cell wall"], answer: 1 },
      { q: "27. Active transport moves substances across a membrane:", options: ["Down a concentration gradient", "Against a concentration gradient", "Without using energy", "By simple evaporation"], answer: 1 },
      { q: "28. Active transport requires energy supplied by:", options: ["Glucose absorption", "Sunlight", "ATP from respiration", "Protein synthesis"], answer: 2 },
      { q: "29. Mineral ions are absorbed into plant root hair cells from low soil concentrations via:", options: ["Diffusion", "Osmosis", "Active transport", "Translocation"], answer: 2 },
      { q: "30. A cell division process that produces identical diploid body cells is:", options: ["Meiosis", "Mitosis", "Fertilization", "Differentiation"], answer: 1 },
      { q: "31. The process by which unspecialized cells become specialized for specific functions is:", options: ["Division", "Differentiation", "Respiration", "Osmosis"], answer: 1 },
      { q: "32. Stem cells found in early human embryos that can differentiate into any cell type are:", options: ["Adult stem cells", "Embryonic stem cells", "Red blood cells", "Nerve cells"], answer: 1 },
      { q: "33. Where are adult stem cells found in the human body?", options: ["Bone marrow", "Hair shaft", "Nails", "Cell wall"], answer: 0 },
      { q: "34. Red blood cells are unique compared to typical animal cells because they lack a:", options: ["Cell membrane", "Cytoplasm", "Nucleus", "Hemoglobin"], answer: 2 },
      { q: "35. Nerve cells (neurons) are specialized to carry:", options: ["Oxygen", "Electrical impulses", "Sucrose", "Digestive enzymes"], answer: 1 },
      { q: "36. Palisade mesophyll cells in leaves are packed with which organelle for photosynthesis?", options: ["Mitochondria", "Chloroplasts", "Ribosomes", "Vacuoles"], answer: 1 },
      { q: "37. A group of similar cells working together to perform a single function is a(n):", options: ["Organ", "Tissue", "Organ system", "Organism"], answer: 1 },
      { q: "38. Which of the following is an example of an organ in human bodies?", options: ["Heart", "Blood", "Epithelium", "Motor neuron"], answer: 0 },
      { q: "39. The stomach, intestines, liver, and pancreas together form the:", options: ["Circulatory system", "Digestive system", "Excretory system", "Nervous system"], answer: 1 },
      { q: "40. Which human organ system is responsible for exchanging oxygen and carbon dioxide?", options: ["Endocrine system", "Respiratory / Gas exchange system", "Excretory system", "Reproductive system"], answer: 1 },
      { q: "41. What is the approximate limit of resolution for a light microscope?", options: ["200 nanometers", "1 nanometer", "10 micrometers", "1 millimeter"], answer: 0 },
      { q: "42. Electron microscopes have higher magnification because they use:", options: ["Light rays", "Beams of electrons", "Laser light", "X-rays"], answer: 1 },
      { q: "43. Which organelle is attached to Rough Endoplasmic Reticulum (RER)?", options: ["Mitochondria", "Ribosomes", "Vacuoles", "Chloroplasts"], answer: 1 },
      { q: "44. In a plant, water enters root cells primarily by:", options: ["Osmosis", "Active transport", "Excretion", "Phagocytosis"], answer: 0 },
      { q: "45. Fungi store carbohydrate reserves as:", options: ["Starch", "Glycogen", "Cellulose", "Sucrose"], answer: 1 },
      { q: "46. Which metabolic process produces carbon dioxide during bread making?", options: ["Photosynthesis", "Anaerobic respiration in yeast", "Lactic acid fermentation", "Active transport"], answer: 1 },
      { q: "47. Small structures suspended inside the cytoplasm performing specific functions are called:", options: ["Tissues", "Organs", "Organelles", "Organisms"], answer: 2 },
      { q: "48. How many nanometers (nm) are in 1 micrometer (µm)?", options: ["10", "100", "1000", "10000"], answer: 2 },
      { q: "49. Which system in humans transports nutrients and oxygen to body tissues?", options: ["Circulatory system", "Excretory system", "Nervous system", "Digestive system"], answer: 0 },
      { q: "50. Which organelle isolates digestive/respiratory enzymes from the rest of the cytoplasm?", options: ["Mitochondria", "Nucleus", "Cell membrane", "Vacuole/Lysosome"], answer: 0 }
    ];

    const questionsContainer = document.getElementById('questions-container');
    const quizForm = document.getElementById('quiz-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-message');
    const resultsScreen = document.getElementById('results-screen');
    const scoreDisplay = document.getElementById('score-display');
    const scorePercent = document.getElementById('score-percent');
    const reviewContainer = document.getElementById('review-container');

    // Render Questions
    function renderQuiz() {
      quizData.forEach((qObj, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const qTitle = document.createElement('div');
        qTitle.className = 'question-title';
        qTitle.textContent = qObj.q;
        card.appendChild(qTitle);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'options';

        qObj.options.forEach((opt, optIdx) => {
          const label = document.createElement('label');
          label.className = 'option-label';

          const radio = document.createElement('input');
          radio.type = 'radio';
          radio.name = `question_${index}`;
          radio.value = optIdx;
          radio.required = true;

          label.appendChild(radio);
          label.appendChild(document.createTextNode(opt));
          optionsDiv.appendChild(label);
        });

        card.appendChild(optionsDiv);
        questionsContainer.appendChild(card);
      });
    }

    renderQuiz();

    // Check if all 50 questions are answered
    function checkAllAnswered() {
      for (let i = 0; i < quizData.length; i++) {
        const selected = document.querySelector(`input[name="question_${i}"]:checked`);
        if (!selected) return false;
      }
      return true;
    }

    // Standard Formspree setup script init
    window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
    
    // Initialize Formspree AJAX
    formspree('initForm', { 
      formElement: '#quiz-form', 
      formId: 'xyeyzpod' 
    });

    // Custom Handle Form Submission & Validation
    quizForm.addEventListener('submit', function (e) {
      if (!checkAllAnswered()) {
        e.preventDefault();
        e.stopPropagation();
        errorMsg.style.display = 'block';
        return false;
      }
      
      errorMsg.style.display = 'none';

      // Calculate score before sending data to Formspree
      let score = 0;
      let summaryLog = "";

      quizData.forEach((qObj, index) => {
        const selected = document.querySelector(`input[name="question_${index}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : -1;
        if (userAns === qObj.answer) {
          score++;
        }
        summaryLog += `Q${index + 1}: ${userAns === qObj.answer ? 'CORRECT' : 'WRONG'} | `;
      });

      // Update hidden fields for Formspree submission payload
      document.getElementById('final-score-input').value = `${score} / 50`;
      document.getElementById('answers-summary-input').value = summaryLog;

      // Display Local Results after delay/submission
      setTimeout(() => {
        showResults(score);
      }, 500);
    });

    function showResults(score) {
      quizForm.style.display = 'none';
      resultsScreen.style.display = 'block';

      scoreDisplay.textContent = `${score} / 50 Marks`;
      const percentage = ((score / 50) * 100).toFixed(1);
      scorePercent.textContent = `Percentage Score: ${percentage}%`;

      // Build Answer Review
      quizData.forEach((qObj, index) => {
        const selected = document.querySelector(`input[name="question_${index}"]:checked`);
        const userAns = selected ? parseInt(selected.value) : -1;

        const revItem = document.createElement('div');
        revItem.className = 'review-item';

        const isCorrect = userAns === qObj.answer;
        revItem.innerHTML = `
          <strong>${qObj.q}</strong><br>
          Your Answer: <span class="${isCorrect ? 'correct-text' : 'wrong-text'}">${userAns !== -1 ? qObj.options[userAns] : 'None'}</span><br>
          ${!isCorrect ? `<span class="correct-text">Correct Answer: ${qObj.options[qObj.answer]}</span>` : ''}
        `;
        reviewContainer.appendChild(revItem);
      });
    }
  </script>
</body>
</html>
